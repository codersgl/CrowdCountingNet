backbone: vgg16_bn # vgg16_bn | vgg16 | dinov2_s | dinov2_b | dinov2_l
backbone_type: vgg # vgg | dinov2
row: 2
line: 2
set_cost_class: 1.0
set_cost_point: 0.05
point_loss_coef: 0.0002
eos_coef: 0.5
use_gm: false
gm_input_dim: 256
gm_hidden_dim: 128
use_msaa: false
msaa_in_channels: 1280
msaa_reduction: 4

# Feature fusion branch selection: gcn | esca_moe
fusion_mode: gcn

moe:
  top_k: 2
  temperature_init: 1.0
  temperature_min: 0.4
  temperature_decay: 0.99998
  stage1_ratio: 0.15
  stage2_gating_lr_multiplier: 3.0
  aux_loss_weight: 2.0
  lambda_balance: 0.835
  lambda_decorr: 1.0
