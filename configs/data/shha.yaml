dataset: SHHA
data_root: "data/shanghaitech/part_A_final" # override: data.data_root=/path/to/sha
batch_size: 8

# === Spatial Transforms ===
patch: true
patch_size: 128 # spatial size of each random crop (must be divisible by 8)
num_patches: 4 # number of patches to extract per sample during training

flip: true
flip_prob: 0.5 # probability of horizontal flip

# === Training Augmentation ===
augmentation:
  # Color augmentation
  color_jitter:
    enabled: true
    apply_prob: 0.5 # probability of applying ColorJitter
    brightness: 0.4 # brightness jitter range [max(0, 1-b), 1+b]
    contrast: 0.4 # contrast jitter range [max(0, 1-c), 1+c]
    saturation: 0.4 # saturation jitter range [max(0, 1-s), 1+s]
    hue: 0.1 # hue jitter range [-h, h], h in [0, 0.5]

  # Random grayscale conversion
  random_grayscale:
    enabled: true
    prob: 0.1 # probability of converting image to grayscale

  # A4: Random Gaussian Blur (applied after normalisation, before scaling)
  gaussian_blur:
    enabled: true
    prob: 0.1 # probability of applying per sample
    kernel_size: 5 # Gaussian kernel size (must be odd; 5 captures sigma as low as 0.3)
    sigma_range: [0.3, 1.5] # uniform sigma sampling range (min, max)

  # Random scaling (A3: widen via scale_min: 0.5, scale_max: 1.6 for more diversity)
  random_scale:
    enabled: true
    scale_min: 0.7 # minimum scale factor
    scale_max: 1.3 # maximum scale factor

  # A1: Random erasing of rectangle; drops point annotations inside the box.
  random_erasing:
    enabled: false
    prob: 0.5 # probability of applying per patch
    scale_range: [0.02, 0.2] # erased area as fraction of patch area
    ratio_range: [0.3, 3.3] # aspect ratio (h/w) of erased box
    fill: 0.0 # value used to fill the erased region (post-normalisation)

  # A2: Multi-scale random patch (crop at variable size, resize back to patch_size).
  multi_scale_patch:
    enabled: false
    patch_size_choices: [96, 128, 192] # all entries must be positive multiples of 8

  # B3: CopyPasteDense — paste the densest source window onto the sparsest dest
  # window. Auto-disabled when use_depth=true. Operates at collate level.
  copy_paste_dense:
    enabled: false
    prob: 0.5 # probability per pair within a batch
    paste_size: 64 # square window size (must be a multiple of 8)
    feather_sigma: 8.0 # Gaussian feather sigma for blending; 0 => hard paste

# === Depth Map Processing ===
depth_blur:
  kernel_size: 15 # Gaussian blur kernel size (must be odd)
  sigma: 5.0 # Gaussian blur sigma for smoothing depth edges

# === Density Map Generation ===
density_generation:
  # When true, use depth-derived perspective maps to modulate per-pedestrian
  # Gaussian kernel widths (sigma = max(beta * perspective, min_sigma)).
  # When false (default), the k-NN geometry-adaptive kernel is used.
  perspective_guided: false

  beta: 1.0      # sigma scaling factor applied to perspective value
  min_sigma: 4.6 # minimum sigma floor in pixels
  disparity_input: true  # DepthAnythingV2 outputs disparity (larger=closer)
