backbone: vgg16_bn # vgg16_bn | vgg16 | dinov2_s | dinov2_b | dinov2_l
backbone_type: vgg # vgg | dinov2
row: 2
line: 2
set_cost_class: 1.0
set_cost_point: 0.05
point_loss_coef: 0.0002
eos_coef: 0.5
count_loss_coef: 0.0 # Global counting L1 loss weight; set >0 to enable (recommended: 0.001~0.01)
use_gm: false
gm_input_dim: 256
gm_hidden_dim: 128
gm_spatial: true # true: per-pixel spatial gate | false: legacy global gate
use_msaa: false
msaa_in_channels: 1280
msaa_reduction: 4

# Feature fusion branch selection: gcn | esca_moe
fusion_mode: gcn

# Adaptive GCN graph construction (only used when fusion_mode: gcn)
gcn_adaptive: false # true: density/sim-adaptive k | false: fixed k=gcn_k
gcn_k: 4 # base k for fixed mode; also k_base for adaptive mode
gcn_k_min: 2 # adaptive mode: minimum neighbours per node
gcn_k_max: 8 # adaptive mode: maximum neighbours per node
gcn_density_scale: 4.0 # adaptive DensityGCN: scale factor for density → k mapping
gcn_sim_threshold: 0.5 # adaptive FeatureGCN: cosine similarity threshold

moe:
  top_k: 2
  temperature_init: 1.0
  temperature_min: 0.4
  temperature_decay: 0.99998
  aux_loss_weight: 0.2 # reduced from 2.0 to keep MoE aux << task loss
  lambda_balance: 0.05
  lambda_decorr: 10.0
  use_density_hint: true

use_dino_inject: false
dino_inject_variant: dinov2_b

# Depth map dual-stream fusion (disabled by default)
use_depth: false
depth:
  encoder: vitl # vits | vitb | vitl
  weight_path: checkpoints/depth_anything_v2_vitl.pth
  embed_dim: 128 # internal dim for DepthFusionModule
  num_isf_layers: 1 # stacked ISFLayer+MFF pairs per scale

use_depth_geo: false
depth_geo:
  num_heads: 8
  initial_value: 2.0
  heads_range: 4.0

# SEMC post-GCN enhancer (disabled by default; enable via CLI or override)
use_semc_enhancer: false
semc:
  position: post_gcn # only post_gcn is implemented in v1
  expansion_factor: 4 # MSCB internal channel expansion ratio
  kernel_sizes: [1, 3, 5] # parallel DW conv kernel sizes
  use_residual: true # strongly recommended; stabilises early training
  use_density_hint: false # gate the enhanced branch with density_out

# Focal Loss (disabled by default; falls back to weighted CE)
use_focal_loss: false
focal_loss:
  alpha: 0.25 # Weighting factor for foreground class
  gamma: 2.0 # Focusing parameter; higher = more focus on hard examples

# Deformable Convolution in PA-FPN (disabled by default)
use_dcn: false

# Iterative Point Refinement Decoder (disabled by default)
use_refine: false
refine:
  num_steps: 2 # refinement iterations T
  hidden_dim: 256 # MLP intermediate dimension
  share_weights: true # share MLP parameters across steps

# Super-Node GCN mode (alternative to dual-stream GCN; disabled by default)
# When gcn_mode is "supernode", replaces DensityGCN + FeatureGCN with a single
# Gather→Process→Scatter super-node GCN that runs in O(NM) instead of O(N²).
gcn_mode: fixed # fixed | supernode
gcn_num_supernodes: 8 # number of learnable prototype super-nodes
gcn_supernode_heads: 4 # multi-head attention heads in gather/scatter

# Frequency-Decoupled Head routing (disabled by default)
# Splits shared trunk features into low-freq (→ density) and high-freq (→ regression)
# via Laplacian decomposition. Zero learnable parameters.
use_freq_head: false
freq_head_kernel: 3 # AvgPool kernel size for low-pass filter

# Sub-Pixel Refinement (disabled by default)
# For top-K high-confidence points, bilinear-samples from C3 (stride 8) features
# and predicts residual offset, improving localisation in dense regions.
use_subpix_refine: false
subpix_refine:
  top_k: 512 # number of high-confidence points to refine
  hidden_dim: 128 # MLP hidden dimension
