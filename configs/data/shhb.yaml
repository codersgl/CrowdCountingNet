dataset: SHHB
data_root: "data/shanghaitech/part_B_final"
batch_size: 8

# Part B is lower-density and camera geometry is steadier than Part A.
# Use larger crops and milder augmentation to avoid dropping sparse heads.
resize:
  enabled: false
  max_long_side: null
  keep_aspect_ratio: true

patch: true
patch_size: 256
num_patches: 1

flip: true
flip_prob: 0.5

augmentation:
  color_jitter:
    enabled: false
    apply_prob: 0.2
    brightness: 0.1
    contrast: 0.1
    saturation: 0.1
    hue: 0.02

  random_grayscale:
    enabled: false
    prob: 0.05

  gaussian_blur:
    enabled: false
    prob: 0.1
    kernel_size: 5
    sigma_range: [0.3, 1.0]

  random_scale:
    enabled: false
    scale_min: 0.9
    scale_max: 1.1

  random_erasing:
    enabled: false
    prob: 0.2
    scale_range: [0.01, 0.08]
    ratio_range: [0.5, 2.0]
    fill: 0.0

  multi_scale_patch:
    enabled: false
    patch_size_choices: [192, 256, 320]

  copy_paste_dense:
    enabled: false
    prob: 0.5
    paste_size: 64
    feather_sigma: 8.0

depth_blur:
  kernel_size: 15
  sigma: 5.0

density_generation:
  mode: fixed
  fixed_sigma: 8.0

  perspective_guided: false
  hybrid: false
  beta: 1.0
  min_sigma: 4.6
  hybrid_min_sigma: 1.5
  hybrid_max_sigma: null
  hybrid_alpha: 0.7
  sigma_base: 4.0
  persp_max_sigma: null
  disparity_input: true
