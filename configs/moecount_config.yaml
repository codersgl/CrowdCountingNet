defaults:
  - data: shha
  - model: moecount
  - optimizer: adamw
  - scheduler: cosine_annealing
  - _self_

# Runtime
seed: 42
gpu_id: 0
num_workers: 8
eval_freq: 1

# Training
epochs: 1500
clip_max_norm: 5.0
frozen_weights: null
resume: ""
reset_optimizer: false
start_epoch: 0

# Output dirs, relative to Hydra run dir
checkpoints_dir: checkpoints
tensorboard_dir: runs/moecount

mixed_precision:
  enabled: true

optimizer:
  name: adamw
  lr: 0.0001
  lr_backbone: 0.00001
  lr_gate: 0.0001
  weight_decay: 0.01
  amsgrad: false

scheduler:
  name: cosine_annealing
  T_max: ${epochs}
  eta_min: 1e-6
  warmup_epochs: 5
  warmup_start_factor: 0.001

moecount_loss:
  use_pml: true  # true = ProximalMappingLoss, false = BayesianLoss
  pml:
    sigma: 8.0
    use_background: true  # push empty-region density to zero (fixes "global wash")
    bg_threshold: 2.5  # sigma * threshold = pixel distance for background classification
    max_pixels_per_chunk: 16384
    sigma_schedule:  # linear anneal: large→small sigma (stabilise→sharpen)
      start_epoch: 0
      end_epoch: 300
      sigma_start: 12.0
      sigma_end: 6.0
  bayesian:  # fallback when use_pml=false
    sigma: 8.0
    use_background: false
    bg_ratio: 0.05
    count_loss_type: l1
    max_pixels_per_chunk: 16384
  count:
    weight: 0.4  # fixed count loss weight (reduced to balance PML gradient)
  balance:
    lambda_importance: 0.001
    lambda_load: 0.001
    decay_epochs: 100  # epochs over which CV^2 loss decays to 0 after warmup
  point:
    weight: 0.5  # point auxiliary loss weight (0 = disabled)
    cost_class: 1.0  # Hungarian matcher classification cost weight
    cost_l1: 1.0  # Hungarian matcher L1 distance cost weight
    focal_alpha: 0.75  # focal loss alpha for foreground class
    focal_gamma: 2.0  # focal loss gamma
    eos_coef: 0.1  # background class weight in empty_weight
  ot:
    enabled: false  # Sinkhorn OT auxiliary loss (DM-Count, NeurIPS 2020) — disabled: NaN bug to fix
    weight: 0.05  # OT loss weight in total loss
    epsilon: 0.1  # Sinkhorn entropic regularization
    num_iters: 50  # Sinkhorn iterations
    max_grid: 32  # downsample density to max_grid x max_grid for OT cost matrix
  diversity_weight: 0.05  # expert activation cosine similarity penalty (P0-4)
  expert_supervision_weight: 0.2  # per-expert density PML weight (P1-1)
  ssim_weight: 0.05  # patch-wise SSIM local structure loss (P3-1)
  density_s4_weight: 0.3  # stride-4 density PML weight (P3-2)
  grad_weight: 0.01  # gradient-aware density loss (P3-3)

monitor:
  log_interval: 100
  vis_interval: 500
  vis_dir: visuals/moecount

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
