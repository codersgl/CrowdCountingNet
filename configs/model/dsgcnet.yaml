backbone: vgg16_bn # vgg16_bn | vgg16 | dinov2_s | dinov2_b | dinov2_l | convnext_tiny | convnext_small | convnext_base | convnext_large
backbone_type: vgg # vgg | dinov2 | convnext
row: 2
line: 2
set_cost_class: 1.0
set_cost_point: 0.05
point_loss_coef: 0.0002
eos_coef: 0.5
count_loss_coef: 0.0 # Global counting L1 loss weight; set >0 to enable (recommended: 0.001~0.01)
consistency_loss_coef: 0.0 # Density-point consistency loss weight; set >0 to enable (recommended: 0.001~0.01)
use_gm: false
gm_input_dim: 256
gm_hidden_dim: 128
gm_spatial: true # true: per-pixel spatial gate | false: legacy global gate
use_density_attention: false # Use density_out as a spatial attention mask on fused features
density_attention_mode: sigmoid # sigmoid | learned
use_msaa: false
msaa_in_channels: 1280
msaa_reduction: 4
msaa_variant: legacy # legacy | lite | msaa_gate
fpn_attention: false # Phase 2: inject attention gates inside PA-FPN

# Feature fusion branch selection: gcn | esca_moe | gcn_moe | graph_attn_moe | mamba_moe
# gcn_moe: GCN dual-stream + LightMoE post-refinement (recommended)
# graph_attn_moe: 2-expert MoE (local conv + graph-biased attention)
# mamba_moe: routed directional Mamba experts + shared channel scan
fusion_mode: gcn

# Adaptive GCN graph construction (only used when fusion_mode: gcn)
gcn_adaptive: false # true: density/sim-adaptive k | false: fixed k=gcn_k
gcn_k: 4 # base k for fixed mode; also k_base for adaptive mode
gcn_k_min: 2 # adaptive mode: minimum neighbours per node
gcn_k_max: 8 # adaptive mode: maximum neighbours per node
gcn_density_scale: 4.0 # adaptive DensityGCN: scale factor for density → k mapping
gcn_sim_threshold: 0.5 # adaptive FeatureGCN: cosine similarity threshold

# Uncertainty-Guided Adaptive GCN (disabled by default)
# Computes pixel-wise uncertainty from the density head and uses it to:
# 1) modulate per-node k in the graph builder (high uncertainty → more neighbours)
# 2) weight the point regression loss (high uncertainty → higher loss weight)
use_uncertainty: false
uncertainty_scale: 6.0 # Graph builder: how much uncertainty boosts k
uncertainty_boost: 2.0 # Loss weighting: max multiplier for high-uncertainty points

# Edge-Conditioned Anisotropic GCN (ECA-GCN)
# Replaces isotropic GCNConv with edge-conditioned message passing: each edge's
# similarity/distance is fed through an MLP to produce per-edge gating weights.
gcn_aniso: false

moe:
  top_k: 3 # all experts active (soft routing); kept for API compat
  temperature_init: 1.0
  temperature_min: 0.4
  temperature_decay: 0.99998
  aux_loss_weight: 0.2
  lambda_balance: 0.01
  grid_stride: 4
  use_density_hint: true

# Graph-Aware MoE (only used when fusion_mode: graph_attn_moe)
graph_attn_moe:
  # Router
  grid_stride: 4 # coarse routing patch size
  router_detach_density: true # detach density_out for router input
  lambda_balance: 0.01 # expert balance loss weight

  # GraphAttentionExpert
  num_heads: 4 # multi-head self-attention heads
  use_density_bias: true # use density similarity as attention bias
  density_bias_scale: 1.0 # learnable init scale for density bias
  attn_dropout: 0.1

  # LocalExpert
  local_kernels: [1, 3, 5] # depthwise conv kernel sizes
  local_expansion: 4 # channel expansion factor
  local_use_density_gate: true # density-conditioned receptive field gating

  # Local-first enhancements (all disabled/neutral by default)
  local_window_size: 0 # 0=disabled; >0 partitions LocalExpert into windows of this size
  local_prior: 0.0 # router logit bias toward local expert; 0=neutral, >0=local-first

  # Ablation switches (all false by default)
  disable_graph_bias: false # disable graph bias → plain self-attention
  disable_local_expert: false # disable local expert → global only
  disable_global_expert: false # disable global expert → local only

# MambaMoE fusion (only used when fusion_mode: mamba_moe)
mamba_moe:
  d_state: 16
  d_conv: 3
  expand: 2.0
  num_experts: 4
  top_k: 2
  lr_space: exp
  num_blocks: 1
  mlp_hidden: 256
  drop_path: 0.1
  lambda_balance: 0.01
  use_density_hint: false
  d_spectral: 256

use_dino_inject: false
dino_inject_variant: dinov2_b

# Depth map dual-stream fusion (disabled by default)
use_depth: false
depth:
  encoder: vitl # vits | vitb | vitl
  weight_path: checkpoints/depth_anything_v2_vitl.pth
  embed_dim: 128 # internal dim for DepthFusionModule
  num_isf_layers: 1 # stacked ISFLayer+MFF pairs per scale

use_depth_geo: false
depth_geo:
  num_heads: 8
  initial_value: 2.0
  heads_range: 4.0

# SEMC post-GCN enhancer (disabled by default; enable via CLI or override)
use_semc_enhancer: false
semc:
  position: post_gcn # only post_gcn is implemented in v1
  expansion_factor: 4 # MSCB internal channel expansion ratio
  kernel_sizes: [1, 3, 5] # parallel DW conv kernel sizes
  use_residual: true # strongly recommended; stabilises early training
  use_density_hint: false # gate the enhanced branch with density_out

# Focal Loss (disabled by default; falls back to weighted CE)
use_focal_loss: false
focal_loss:
  alpha: 0.25 # Weighting factor for foreground class
  gamma: 2.0 # Focusing parameter; higher = more focus on hard examples

# Deformable Convolution in PA-FPN (disabled by default)
use_dcn: false

# Iterative Point Refinement Decoder (disabled by default)
use_refine: false
refine:
  num_steps: 2 # refinement iterations T
  hidden_dim: 256 # MLP intermediate dimension
  share_weights: true # share MLP parameters across steps

# Super-Node GCN mode (alternative to dual-stream GCN; disabled by default)
# When gcn_mode is "supernode", replaces DensityGCN + FeatureGCN with a single
# Gather→Process→Scatter super-node GCN that runs in O(NM) instead of O(N²).
gcn_mode: fixed # fixed | supernode | cross_stream
gcn_num_supernodes: 8 # number of learnable prototype super-nodes
gcn_supernode_heads: 4 # multi-head attention heads in gather/scatter

# Frequency-Decoupled Head routing (disabled by default)
# Splits shared trunk features into low-freq (→ density) and high-freq (→ regression)
# via Laplacian decomposition. Zero learnable parameters.
use_freq_head: false
freq_head_kernel: 3 # AvgPool kernel size for low-pass filter

# Sub-Pixel Refinement (disabled by default)
# For top-K high-confidence points, bilinear-samples from C3 (stride 8) features
# and predicts residual offset, improving localisation in dense regions.
use_subpix_refine: false
subpix_refine:
  top_k: 512 # number of high-confidence points to refine
  hidden_dim: 128 # MLP hidden dimension

# Foreground Suppression Branch (disabled by default)
# Pixel-level foreground gating with residual pass-through to suppress background.
# Supervised by binarised GT density maps (no extra annotation needed).
use_fg_branch: false
fg_branch_base: 0.5 # minimum feature pass-through ratio
fg_branch_scale: 0.5 # max additional boost from foreground probability
