defaults:
  - data: shha
  - model: dsgcnet
  - optimizer: adamw
  - scheduler: cosine_annealing
  - _self_

# Runtime
seed: 42
gpu_id: 0
num_workers: 8
eval_freq: 1

# Training
epochs: 3500
clip_max_norm: 0.1
frozen_weights: null
resume: ""
reset_optimizer: false
start_epoch: 0

# Output dirs (hydra manages outputs/)
checkpoints_dir: checkpoints
tensorboard_dir: runs/dsgc

density_loss_weight: 0.01 # Global scale factor applied to all density map losses

density_ssim:
  enabled: false # Add SSIM structure loss on the main density map
  weight: 0.005 # Relative weight of SSIM loss before adding into den_loss
  # window_size: density maps are downsampled to 16x16 before SSIM.
  # ws=11 → 14% interior coverage; ws=7 → 39%; ws=5 → 56%.
  # Recommend 7 for 16x16 targets, 11 for full-resolution if used elsewhere.
  window_size: 7 # Must be odd; 7 is a good default for 16x16 density maps
  sigma: 1.5 # Gaussian kernel sigma for SSIM window

# Iterative Point Refinement loss weight (only used when model.use_refine: true)
refine_loss_weight: 0.001

# Foreground Suppression Branch loss (only used when model.use_fg_branch: true)
fg_loss_weight: 0.1
fg_pos_weight: 5.0 # BCE pos_weight to handle foreground/background imbalance

# Multi-scale density prediction (experimental)
density_multi_scale:
  enabled: false # Enable multi-scale density prediction with auxiliary supervision
  weights:
    block3: 0.5 # Weight for H/8 density loss
    block4: 1.0 # Weight for H/16 density loss (original scale)
    block5: 0.5 # Weight for H/32 density loss

# Cross-scale density consistency (only used when density_multi_scale.enabled: true)
density_cross_scale_weight: 0.001
    original: 1.0 # Weight for original PA-FPN density loss

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
