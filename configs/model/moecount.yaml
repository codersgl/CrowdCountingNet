name: moecount
output_stride: 8

backbone:
  type: convnext # convnext | vgg
  # --- ConvNeXt options (when type: convnext) ---
  arch: convnext_tiny # convnext_tiny | convnext_small | convnext_base | convnext_large
  model_name: null # optional timm model name override
  pretrained: true
  pretrained_path: null # optional local .tar.gz/.safetensors/.pth file; disables online download
  out_indices: [1, 2, 3] # stride-8, stride-16, and stride-32 ConvNeXt feature levels
  # --- VGG options (when type: vgg) ---
  vgg_name: vgg16_bn # vgg16_bn | vgg16
  num_output_levels: 3 # 2 (c2,c3) or 3 (c2,c3,c4)

neck:
  out_channels: 256
  num_bifpn_blocks: 1
  branch_channels: [128, 64, 64]
  dilations: [1, 2, 5]
  use_spd_downsample: true
  use_depthwise_refine: true

moe:
  gate_type: soft  # "soft" (PixelSoftGate) or "sparse_top2" (SparseTop2Gate with Gumbel-ST)
  top_k: 2
  gate_hidden_channels: 128
  temperature_init: 1.0
  temperature_min: 0.1
  temperature_decay: 0.9
  warmup_fraction: 0.1
  warmup_epochs: 60
  lambda_importance: 0.1
  lambda_load: 0.001
  shared_scale: 0.3
  use_input_residual: true  # adds features identity to MoE output

  # Expert configuration: control per-expert behavior
  expert_config:
    local_detail:
      use_residual: false   # true = old gated residual (identity pass-through)
      use_strip_convs: true          # parallel 1xK + Kx1 depthwise strip branches
      strip_kernel: 7                # strip kernel size (recommend 5-9)
      use_multi_spectral_se: true    # FcaNet-style DCT multi-spectral attention
      ms_num_freqs: 4                # number of DCT frequency components
    global_density:
      use_residual: false   # true = old gated residual (identity pass-through)

  # Deformable Cross-Scale Expert — replaces SpatialRelationExpert's W-MSA
  # with DAT-style multi-scale deformable attention.
  # Set use_deformable: false to revert to the original window attention.
  deformable_expert:
    use_deformable: true
    num_heads: 4              # attention heads (channels must be divisible)
    num_sampling_points: 8    # K: sampling points per scale level
    num_scale_levels: 3       # L: P3(stride-8) + P4(stride-16) + P5(stride-32)
    max_offset: 8.0           # max offset in stride-8 pixels (tanh clamp)
    dropout: 0.1              # attention + FFN dropout
    use_se: true              # SE channel attention after FFN

head:
  hidden_channels: 128
  final_activation: softplus # relu | softplus | none
  initial_density: 0.01 # expected count per stride-8 density cell at init
  final_weight_std: 0.0001
  output_kernel_size: 3  # 1 = 1x1 (per-pixel), 3 = 3x3 (spatial context)
  use_residual: true      # skip connection in DensityHead
  use_point_head: true  # P2PNet-style point prediction auxiliary head
  point_hidden_channels: 128
  point_coord_scale: 12.5  # regression coord amplification (× stride × scale ≈ 100, matching DSGCNet)

use_gcn: false  # enable density-guided GCN feature refinement
gcn_k: 4  # k for density k-NN graph building
