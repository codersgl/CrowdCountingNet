defaults:
  - data: shha
  - model: dsgcnet
  - optimizer: adamw
  - scheduler: cosine_annealing
  - _self_

# Runtime
seed: 42
gpu_id: 0
num_workers: 8
eval_freq: 1

# Training
epochs: 3500
clip_max_norm: 0.1
frozen_weights: null
resume: ""
reset_optimizer: false
start_epoch: 0

# Output dirs (hydra manages outputs/)
checkpoints_dir: checkpoints
tensorboard_dir: runs/dsgc

density_loss_weight: 0.01 # Global scale factor applied to all density map losses

# Uncertainty Weighting (Kendall et al. 2018): learnable multi-task loss balancing.
# When enabled, replaces fixed density_loss_weight / weight_dict scalars with
# learned log-variance parameters that auto-balance density, CE, and regression losses.
uncertainty_weighting:
  enabled: false
  # Initial log(σ²) values derived from current fixed weights: s₀ = -log(2w)
  init_log_var_den: 3.91 # ← from density_loss_weight=0.01
  init_log_var_ce: -0.693 # ← from loss_ce weight=1.0
  init_log_var_reg: 8.52 # ← from point_loss_coef=0.0002
  lr_scale: 1.0 # σ param lr = base_lr × lr_scale

# DM-Count style density loss (RCCFormer §3.3): L_C + λ1·L_OT + λ2·L_TV
# When enabled, replaces the default MSE density loss with distribution-matching.
density_dmcount:
  enabled: false
  lambda_count: 1.0 # Counting loss weight
  lambda_ot: 0.1 # Optimal Transport (Wasserstein) loss weight
  lambda_tv: 0.01 # Total Variation regularisation weight
  count_loss_type: "l1" # "l1" or "mse"

# ASACL: Adaptive Structural-Perceptual Composite Loss (multi-component density loss).
# When enabled, replaces the default MSE / DM-Count density loss with a 3-part loss:
#   L = λ_adapt · AdaptiveWeightedL1 + λ_struct · SSIM(ws=5) + λ_percept · VGGPerceptual
density_asacl:
  enabled: false
  beta: 1.0 # Adaptive weight control (β / (|Y| + β))
  lambda_adapt: 1.0 # Weight for adaptive spatial L1
  lambda_struct: 0.5 # Weight for local SSIM structure loss
  lambda_percept: 0.1 # Weight for VGG perceptual loss

density_ssim:
  enabled: false # Add SSIM structure loss on the main density map
  weight: 0.005 # Relative weight of SSIM loss before adding into den_loss
  # window_size: density maps are downsampled to 16x16 before SSIM.
  # ws=11 → 14% interior coverage; ws=7 → 39%; ws=5 → 56%.
  # Recommend 7 for 16x16 targets, 11 for full-resolution if used elsewhere.
  window_size: 7 # Must be odd; 7 is a good default for 16x16 density maps
  sigma: 1.5 # Gaussian kernel sigma for SSIM window
  data_range: null # null = auto from input max; set a float to fix (e.g. 100.0)

# Iterative Point Refinement loss weight (only used when model.use_refine: true)
refine_loss_weight: 0.001

# Foreground Suppression Branch loss (only used when model.use_fg_branch: true)
fg_loss_weight: 0.1
fg_pos_weight: 5.0 # BCE pos_weight to handle foreground/background imbalance

# Multi-scale density prediction (experimental)
density_multi_scale:
  enabled: false # Enable multi-scale density prediction with auxiliary supervision
  cross_scale_refine: false # Coarse-to-fine refinement (block5→block4→block3)
  fuse_to_gcn: false # Fuse multi-scale densities into a single map for GCN input
  consistency_weight: 0.0 # Cross-scale pixel-level consistency loss weight (0 = off)
  count_consistency_weight: 0.0 # Cross-scale count consistency loss weight (0 = off)
  weights:
    block3: 0.5 # Weight for H/8 density loss
    block4: 1.0 # Weight for H/16 density loss (original scale)
    block5: 0.5 # Weight for H/32 density loss
    original: 1.0 # Weight for original PA-FPN density loss

# Evaluation counting method
eval_counting:
  method: "threshold" # "threshold" (fixed score cutoff) | "density_guided" (top-k from density integral)
  threshold: 0.5 # Score cutoff used when method="threshold"
  min_score: 0.3 # Minimum confidence filter for density_guided (ignore anchors below this)

# Optimal threshold search: when enabled, searches for the best classification
# threshold each time a new best MAE is found, and stores it in the checkpoint.
threshold_search:
  enabled: false

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
