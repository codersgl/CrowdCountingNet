# SwinCrowdNet model configuration
# Architecture: Swin-Tiny (Stage 1-3) → CrowdFPN (enhanced) → Density_pred →
#   DensityFeatureRefine → MoE-Lite (density-gated) → DecoupledHead → output

architecture: swin_crowd_net

# Backbone
backbone: swin_tiny # swin_tiny | swin_small | swin_base
backbone_pretrained: true

# Anchor grid (same semantics as DSGCNet)
row: 2
line: 2

# Feature dimension (CrowdFPN output channels)
feature_dim: 256

# CrowdFPN input channels (from Swin backbone projections)
fpn_c2_channels: 256 # Stage 1 projected
fpn_c3_channels: 256 # Stage 2 projected
fpn_c4_channels: 512 # Stage 3 projected

# Density-Feature Refinement
use_dfr: true # Density-guided spatial + channel attention before MoE

# Prediction head configuration
use_decoupled_head: true # Decoupled heads for classification vs regression
use_freq_router: true # Frequency-decoupled routing (Laplacian decomposition)

# MoE-Lite (density-gated experts + multi-scale routing + decorrelation)
moe:
  grid_stride: 4 # coarse routing grid stride
  temperature_init: 1.0 # smooth routing early, anneal gradually
  temperature_min: 0.5 # avoid premature hard routing
  lambda_balance: 0.5 # strong balance regularisation
  dense_expansion: 3 # DenseRegionExpert channel expansion (2→3)
  use_density_gate: true # density-conditioned gating inside each expert
  lambda_decorr: 0.5 # expert decorrelation loss weight
  lambda_diversity: 0.1 # expert output diversity loss (cosine similarity penalty)

# Loss weights (consumed by SetCriterion_Crowd via build_model)
set_cost_class: 1.0
set_cost_point: 0.05
point_loss_coef: 0.001
eos_coef: 0.5
count_loss_coef: 0.001 # keep small: unscaled ~2000 with patch_size=256
consistency_loss_coef: 0.001 # keep small: unscaled ~1800 with patch_size=256

# Focal loss (enabled for foreground/background imbalance)
use_focal_loss: true
focal_loss:
  alpha: 0.25
  gamma: 2.0
